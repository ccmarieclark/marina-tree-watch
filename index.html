<style>
/* Layout: a hand-inked, bird's-eye poster map of the Marina (pale-blue bay, white ink-hatched houses, red banner)
   sitting on a dark or light page, with a side panel for the leaderboard and the Tree Lane walking route.
   The poster keeps its own printed colors in both themes; the page around it follows the theme. */
:root {
  --bg: #0e1630;
  --panel: #162247;
  --panel-2: #1e2c5a;
  --line: #2c3c72;
  --fg: #f1f4ff;

  --poster-water: #c9e1e8;
  --poster-ground: #dce9ed;
  --poster-glass: #cfe2e9;
  --poster-park: #f2f5f6;
  --poster-red: #d2352b;
  --poster-road: #e8f1f3;
  --tree: #1d6a48;
  --display: "Gloock", "Georgia", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8edf7; --panel: #ffffff; --panel-2: #f1f4fb; --line: #d3dbec; --fg: #14203f; --muted: #556089;
    --star: #c98a0b; --accent: #c8293f; --shadow: rgba(30, 50, 100, .3);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e8edf7; --panel: #ffffff; --panel-2: #f1f4fb; --line: #d3dbec; --fg: #14203f; --muted: #556089;
  --star: #c98a0b; --accent: #c8293f; --shadow: rgba(30, 50, 100, .3);
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

button { font-family: var(--body); }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--star); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { min-height: 44px; padding: 0 20px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-weight: 600; font-size: 15px; cursor: pointer; }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.hint.live { color: var(--star); font-weight: 600; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 18px; align-items: start; }
.mapcol { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.map svg { overflow: hidden; }
.map { width: 100%; background: var(--poster-paper); border-radius: 6px; box-shadow: 0 3px 6px rgba(20,22,28,.22), 0 16px 34px rgba(20,22,28,.30); overflow: hidden; }
.map svg { width: 100%; height: auto; display: block; touch-action: manipulation; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tabs { display: flex; gap: 4px; background: var(--panel-2); border-radius: 11px; padding: 4px; }
.tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }

.crown small { font-family: var(--mono); color: var(--star); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

.rows { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 15px; }

.stars { display: none; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lab { font-weight: 600; font-size: 14px; }
input[type="text"], input[type="date"], textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 9px; padding: 8px 12px; font: 16px var(--body); }
input[type="file"] { color: var(--muted); font: 14px var(--body); max-width: 100%; }
textarea { min-height: 72px; resize: vertical; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rate button { min-height: 44px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 9px; font-size: 20px; cursor: pointer; }
.rate button[aria-pressed="true"] { background: var(--star); color: #1b1630; border-color: var(--star); }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { color: var(--muted); font-size: 14px; }
.lane-ctl { display: flex; gap: 6px; }
.lane-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.lane-row .w { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.icon { min-width: 36px; min-height: 36px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; cursor: pointer; font-size: 15px; }
.icon[disabled] { opacity: .4; cursor: default; }
.total { font-family: var(--mono); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); }
.total b { color: var(--fg); font-weight: 500; }
.sample-note { border: 1px dashed var(--star); color: var(--star); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.photo { max-width: 260px; width: 100%; border-radius: 10px; display: block; }
/* poster map */
.m-paper { fill: var(--poster-ground); }
.m-frame { fill: none; stroke: var(--ink); }
.m-bay { fill: var(--poster-water); }
.m-wave { display: none; fill: none; stroke: var(--ink); stroke-opacity: .4; stroke-width: 1.2; stroke-linecap: round; }
.m-ground { fill: var(--poster-ground); stroke: var(--poster-ground); stroke-width: 8; stroke-linejoin: round; }
.m-park { fill: var(--poster-park); stroke: var(--ink); stroke-width: 1.1; }
.m-tree { fill: #fff; stroke: var(--ink); stroke-width: .9; stroke-linejoin: round; }
.m-wlab { font: 700 6.5px var(--body); letter-spacing: .12em; text-transform: uppercase; fill: var(--ink); paint-order: stroke; stroke: var(--poster-water); stroke-width: 3.2; stroke-linejoin: round; }
.m-canopy { fill: #fff; stroke: var(--ink); stroke-width: 1; }
.m-ink { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.m-fill { fill: #fff; stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }
.b-f { fill: #fff; stroke: var(--ink); stroke-width: 1.1; stroke-linejoin: round; }
.b-f.alt { fill: url(#hLight); }
.b-s { fill: url(#hSide); stroke: var(--ink); stroke-width: 1.1; stroke-linejoin: round; }
.b-r { fill: url(#hRoof); stroke: var(--ink); stroke-width: 1.1; stroke-linejoin: round; }
.b-r.k { fill: #14161c; }
.b-r.wt { fill: #fff; }
.b-w { fill: var(--poster-glass); stroke: var(--ink); stroke-width: .7; }
.b-g { fill: url(#hDark); stroke: var(--ink); stroke-width: .9; }
.m-street { font: 700 9px var(--body); letter-spacing: .16em; text-transform: uppercase; fill: var(--ink); paint-order: stroke; stroke: var(--poster-ground); stroke-width: 3.5; stroke-linejoin: round; }
.m-pop { font: 700 11px var(--body); letter-spacing: .12em; text-transform: uppercase; fill: var(--ink); paint-order: stroke; stroke: var(--poster-park); stroke-width: 4; }
.m-water { font: 700 11px var(--body); letter-spacing: .5em; fill: var(--ink); fill-opacity: .55; }
.m-title { font: 400 50px var(--display); letter-spacing: .22em; fill: var(--poster-red); }
.m-small { font: 600 10px var(--body); letter-spacing: .3em; text-transform: uppercase; fill: var(--ink); }
.roadarea { fill: var(--poster-road); stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }
.rd-clear { fill: none; stroke: var(--poster-ground); stroke-linecap: butt; stroke-linejoin: round; }
.rd-case { fill: none; stroke: var(--ink); stroke-width: 10.5; stroke-linecap: butt; stroke-linejoin: round; }
.rd { fill: none; stroke: var(--poster-ground); stroke-width: 9; stroke-linecap: butt; stroke-linejoin: round; }
.rd-case.maj { stroke-width: 15; }
.rd.maj { stroke: var(--poster-road); stroke-width: 13; }
.lane-path { fill: none; stroke: var(--accent); stroke-width: 4; stroke-dasharray: 2 9; stroke-linecap: round; stroke-linejoin: round; }
.pin { cursor: pointer; }
.pin .canopy { fill: var(--tree); stroke: var(--ink); stroke-width: 1.4; }
.pin .halo { fill: #fff; stroke: #fff; stroke-width: 7; stroke-linejoin: round; filter: drop-shadow(0 0 1px rgba(20,22,28,.85)); }
.pin .hatch { fill: url(#hCanopy); }
.pin .inkarc { fill: none; stroke: #fff; stroke-opacity: .45; stroke-width: 1.2; stroke-linecap: round; }
.pin .shade { fill: var(--ink); opacity: .25; }
.pin .num { fill: #fff; font: 500 11px var(--mono); text-anchor: middle; paint-order: stroke; stroke: var(--ink); stroke-width: 2.2px; stroke-linejoin: round; }
.pin .ring { fill: none; stroke: var(--star); stroke-width: 3; opacity: 0; }
.pin.sel .ring, .pin.top .ring { opacity: 0; }
.pin:focus, .pin:focus-visible { outline: none; }
.pin.sample { opacity: .88; }
.draft { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 5 5; }

    if (t.note) box.appendChild(el("p", { text: t.note, style: "margin:0" }));
    var acts = el("div", { class: "acts" });
    if (t.lane) acts.appendChild(el("span", { class: "hint", text: "On Tree Lane" }));
    if (canEdit && t.pending) {
      var ab = el("button", { class: "btn sm go", type: "button", text: "Add to map" });
      ab.addEventListener("click", function () { ab.disabled = true; approve(t); });
      var xb = el("button", { class: "btn sm danger", type: "button", text: "Decline" });
      xb.addEventListener("click", function () { xb.disabled = true; dropPending(t).then(function () { selId = null; renderAll(); }); });
      acts.appendChild(ab); acts.appendChild(xb);
    }
    if (canEdit && !t.sample && !t.pending) {
      var eb = el("button", { class: "btn sm", type: "button", text: "Edit" });
      eb.addEventListener("click", function () { openEditor(Object.assign({}, t)); });
      acts.appendChild(eb);
    }
    var cb = el("button", { class: "btn sm", type: "button", text: "Close" });
    cb.addEventListener("click", function () { selId = null; renderAll(); });
    acts.appendChild(cb);
    box.appendChild(acts);
  }

  /* ---------- editor ---------- */
  var rateBtns = [];
  (function () {
    var box = $("#edRate");
    for (var i = 1; i <= 5; i++) (function (v) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = "★"; b.setAttribute("aria-label", v + " of 5"); b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { if (ed) { ed.rating = v; paintRate(); } });
      box.appendChild(b); rateBtns.push(b);
    })(i);
  })();
  function paintRate() { rateBtns.forEach(function (b, i) { b.setAttribute("aria-pressed", String(!!ed && ed.rating >= i + 1)); }); }
  function openEditor(t) {
    ed = t; selId = null; mode = "idle"; ed.file = null;
    $("#edTitle").textContent = t.id ? "Edit tree" : "Add a tree";
    $("#edMove").hidden = !(canEdit && t.id); $("#edSeenField").hidden = !canEdit;
    $("#edLabel").value = t.label; $("#edSeen").value = t.seen; loadSeen(); $("#edBy").value = t.by || ""; $("#edNote").value = t.note || "";
    $("#edLane").checked = !!t.lane; $("#edDel").hidden = !t.id; $("#edStatus").textContent = "";
    $("#edPhoto").value = ""; $("#edPhotoName").textContent = "Take or choose a photo";
    $("#edPhotoField").hidden = false;
    var pv = $("#edPhotoPrev");
    if (t.photo) { pv.src = t.photo; pv.hidden = false; } else { pv.hidden = true; pv.removeAttribute("src"); }
    paintRate(); $("#editor").hidden = false;
    renderAll(); markEx(); fitSheet();
  }
  function closeEditor() { ed = null; mode = "idle"; $("#editor").hidden = true; document.body.style.paddingBottom = ""; if (window.__zoomOut) window.__zoomOut(); renderAll(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  function loadSeen() { var p = ($("#edSeen").value || today()).split("-"); $("#edSeenM").value = String(+p[1]); $("#edSeenD").value = String(+p[2]); }
  function saveSeen() { var p = ($("#edSeen").value || today()).split("-"), m = +$("#edSeenM").value, d = +$("#edSeenD").value; $("#edSeen").value = p[0] + "-" + (m < 10 ? "0" : "") + m + "-" + (d < 10 ? "0" : "") + d; }
  function markEx() { ["#edLabel", "#edSeenM", "#edSeenD"].forEach(function (q) { var e = $(q); if (e) e.classList.toggle("ex", q !== "#edLabel" || !!e.value); }); }
  function clrEx() { this.classList.remove("ex"); }
  function fitSheet() {
    var sh = $("#editor"), h = sh.offsetHeight; document.body.style.paddingBottom = h + "px";
    setTimeout(function () {
      var d = document.querySelector(".draft, .pin.sel"); if (!d) return;
      var r = d.getBoundingClientRect(), room = window.innerHeight - h - 16;
      if (r.bottom > room) window.scrollBy({ top: r.bottom - room + 24, behavior: "smooth" });
      else if (r.top < 60) window.scrollBy({ top: r.top - 80, behavior: "smooth" });
    }, 60);
  }
  function placed(x, y) {
    if (mode === "drop") {
      openEditor({ id: null, x: x, y: y, label: nearLabel(x, y), seen: today(), rating: 5, by: "", note: "", lane: false, photo: "" });
    } else if (mode === "move" && ed) {
      ed.x = x; ed.y = y; mode = "idle"; $("#editor").hidden = false; renderAll();
    }
  }
  $("#edLabel").addEventListener("input", clrEx); $("#edSeenM").addEventListener("change", clrEx); $("#edSeenD").addEventListener("change", clrEx);
  $("#edSeenM").addEventListener("change", saveSeen); $("#edSeenD").addEventListener("change", saveSeen);
  $("#edPhoto").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f || !ed) return;
    ed.file = f; $("#edPhotoName").textContent = "Photo added"; var pv = $("#edPhotoPrev"); pv.src = URL.createObjectURL(f); pv.hidden = false;
  });
  function shrink(file, mx, q) {
    mx = mx || 1000; q = q || 0.82;
    return new Promise(function (res, rej) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, mx / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        c.toBlob(function (b) { b ? res(b) : rej(new Error("blob")); }, "image/jpeg", q);
      };
      img.onerror = function () { rej(new Error("img")); };
      img.src = u;
    });
  }
  $("#drop").addEventListener("click", function () {
    if (sampleOn && !Object.keys(trees).length) sampleOn = false;
    mode = mode === "drop" ? "idle" : "drop"; ed = null; $("#editor").hidden = true; selId = null; renderAll();
  });
  $("#edMove").addEventListener("click", function () { if (ed) { mode = "move"; $("#editor").hidden = true; renderAll(); } });
  $("#edCancel").addEventListener("click", closeEditor);
  function toData(b) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(b); }); }
  function pendingDocUpdate(uid, fn) {
    var ref = db.doc("requests/" + uid);
    return ref.get().then(function (sn) {
      var items = (sn.exists && sn.data() && sn.data().items) || [];
      return ref.set({ items: fn(items) });
    });
  }
  function dropPending(t) {
    return pendingDocUpdate(t.uid, function (items) { return items.filter(function (i) { return i.rid !== t.rid; }); })
      .then(function () { pending = pending.filter(function (q) { return q.id !== t.id; }); });
  }
  function approve(t) {
    var body = { x: t.x, y: t.y, label: t.label, seen: t.seen || today(), rating: 5, by: t.by || "", note: t.note || "", lane: false, photo: t.photo || "", updated: new Date().toISOString() };
    trCol.doc().set(body).then(function () { return dropPending(t); })
      .then(function () { selId = null; renderAll(); }).catch(function () { renderAll(); });
  }
  $("#edSave").addEventListener("click", function () {
    if (!ed) return;
    var label = $("#edLabel").value.trim();
    if (!label) { $("#edStatus").textContent = "Add where the tree is."; return; }
    var cur = ed;
    var st = $("#edStatus");
    if (canEdit && trCol) {
      var body = { x: cur.x, y: cur.y, label: label, seen: $("#edSeen").value || today(), rating: 5, by: $("#edBy").value.trim(), note: $("#edNote").value.trim(), lane: !!cur.lane, photo: cur.photo || "", updated: new Date().toISOString() };
      var ref = cur.id ? trCol.doc(cur.id) : trCol.doc();
      $("#edSave").disabled = true; st.textContent = "Saving...";
      var up = Promise.resolve();
      if (cur.file) up = shrink(cur.file, 720, 0.68).then(toData).then(function (d) { body.photo = d; });
      up.catch(function () { st.textContent = "Photo did not load; saving the tree without it."; })
        .then(function () { return ref.set(body); })
        .then(function () { var id = ref.id; trees[id] = body; selId = id; closeEditor(); })
        .catch(function () { st.textContent = "Could not save. Try again in a moment."; })
        .then(function () { $("#edSave").disabled = false; });
      return;
    }
    
    if (!cur.file) { st.textContent = "Add a photo of the tree."; return; }
    var item = { rid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), x: cur.x, y: cur.y, label: label, by: $("#edBy").value.trim(), note: $("#edNote").value.trim(), at: today(), photo: "" };
    $("#edSave").disabled = true; st.textContent = "Adding...";
    shrink(cur.file, 720, 0.68).then(toData).then(function (d) { item.photo = d; })
      .then(function () { return fetch("/api/submit", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(item) }).then(function (r) { if (!r.ok) throw new Error("send"); }); })
      .then(function () {
        st.textContent = "Thank you! Your tree is waiting for approval.";
        setTimeout(closeEditor, 1800);
      }).catch(function () { st.textContent = "Could not send. Check your connection and try again."; })
      .then(function () { $("#edSave").disabled = false; });
  });
  var armed = false;
  $("#edDel").addEventListener("click", function () {
    if (!ed || !ed.id) return;
    if (!armed) { armed = true; $("#edDel").textContent = "Tap again to delete"; setTimeout(function () { armed = false; $("#edDel").textContent = "Delete"; }, 4000); return; }
    var id = ed.id; armed = false; $("#edDel").textContent = "Delete";
    trCol.doc(id).delete().then(function () { delete trees[id]; saveOrder(laneIds().filter(function (x) { return x !== id; })); closeEditor(); })
      .catch(function () { $("#edStatus").textContent = "Could not delete. Try again."; });
  });

  /* ---------- tabs and toolbar ---------- */
  ["earliest", "jolliest", "lane"].forEach(function (t) {
    $("#t-" + t).addEventListener("click", function () {
      tab = t;
      ["earliest", "jolliest", "lane"].forEach(function (u) { $("#t-" + u).setAttribute("aria-selected", String(u === t)); });
      renderAll();
    });
  });
  $("#sampleBtn").addEventListener("click", function () { sampleOn = !sampleOn; selId = null; renderAll(); });

  function renderBar() {
    $("#drop").hidden = !canEdit;
    $("#drop").textContent = mode === "drop" ? "Cancel" : "Drop a tree";
    var none = !Object.keys(trees).length;
    $("#sampleBtn").hidden = !none;
    $("#sampleBtn").textContent = sampleOn ? "Hide sample trees" : "See sample trees";
    var h = $("#modeHint");
    h.className = "hint" + (mode !== "idle" ? " live" : "");
    h.textContent = mode === "drop" ? "Tap the map where the tree is." : mode === "move" ? "Tap the map for the new spot." : "";
  }
  function renderAll() { renderBar(); renderStats(); drawPins(); renderPanel(); renderDetail(); }

  /* ---------- start ---------- */
  buildMap();
  renderAll();

  fetch("/trees.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) { trees = d || {}; renderAll(); }).catch(function () {});
})();
</script>
